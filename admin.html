<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لوحة الإدارة | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--ok:#2E7D4F;--sage:#DCE5D3;--rose:#F1D9CF;--sky:#D6E2EC;--sh:0 1px 2px rgba(60,45,10,.05),0 14px 34px -14px rgba(60,45,10,.2)}
:root[data-theme=dark]{--bg:#0F1522;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--ok:#6CC38F;--sage:#1F2D2B;--rose:#2C2230;--sky:#1A2A3F;--sh:0 14px 34px -14px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;overflow-x:hidden}
h1,h2,h3,h4,b,.lg{font-family:'Readex Pro',sans-serif;line-height:1.35}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--sf);border-left:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:50;overflow:auto}
.lg img{width:100%;height:auto}.lw-d{display:none}:root[data-theme=dark] .lw-l{display:none}:root[data-theme=dark] .lw-d{display:block}.lg{padding:0 6px 14px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;color:var(--mut);font-weight:600;width:100%;text-decoration:none;transition:.2s}.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--pri);color:var(--onpri)}.nv i{font-style:normal;font-size:18px}.sp{flex:1}
main{margin-right:250px;padding:26px clamp(16px,3vw,44px) 60px;max-width:1180px}
.pg{position:relative;overflow:hidden;border-radius:32px;padding:26px 32px;margin-bottom:18px;color:#F6F0E2;background:linear-gradient(135deg,#1F3A5F,#3A6EA5);box-shadow:0 18px 40px rgba(18,36,61,.25)}
.pg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.4px,transparent 1.6px);background-size:24px 24px;opacity:.5;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.pg>*{position:relative}.pg small{display:inline-block;padding:3px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:13px;margin-bottom:8px}.pg h2{font:700 clamp(28px,4.5vw,42px)/1.2 'Reem Kufi',sans-serif}.pg p{opacity:.9;margin-top:4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.sc{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;margin:0;transition:.25s}.sc:hover{transform:translateY(-3px);border-color:var(--gold)}
.sc .bx{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:none}.t1{background:var(--sage)}.t2{background:var(--rose)}.t3{background:var(--sky)}.t4{background:#F3E2B8}:root[data-theme=dark] .t4{background:#3A3022}
.sc b{font-size:26px;display:block}.sc span{font-size:13.5px;color:var(--mut)}
.mt{color:var(--mut)}.bd{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut)}.bd.ok{background:var(--ok);color:#fff}.bd.no{background:#b3402a;color:#fff}.bd.g{background:var(--gold);color:#1B1405}
.btn{border-radius:99px;padding:8px 18px;border:1.5px solid var(--ln);background:none;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.gld{background:linear-gradient(135deg,#F0C46E,#C98A1F);color:#1B1405;border:0}.btn.no{border-color:#b3402a;color:#b3402a}.btn.sm{padding:4px 12px;font-size:14px}
input,textarea,select{width:100%;padding:11px 15px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);margin:5px 0 12px}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--gold)}
.fl{display:block;font-weight:600;font-size:14px}.rw{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.rw:last-child{border:0}.rw>.gr{flex:1;min-width:150px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{margin:0;flex:1;min-width:150px}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chp{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 16px;font-weight:600}.chp.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.g3 div{background:var(--bg2);border-radius:18px;padding:10px;text-align:center}.g3 b{font-size:24px;display:block;color:var(--pri)}.g3 span{font-size:13px;color:var(--mut)}
.mdl{position:fixed;inset:0;z-index:200;background:rgba(10,16,28,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px}.mb{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px 20px;margin:0}.mb h3{font:700 22px 'Reem Kufi',sans-serif;margin-bottom:6px}.mb h4{margin:16px 0 4px;color:var(--pri)}
.mx{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--sf)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;max-width:90vw;text-align:center}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.flow div{background:var(--bg2);border-radius:18px;padding:12px;font-size:14px}.flow b{color:var(--gold);display:block}
@media(max-width:860px){aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;flex-direction:row;padding:6px;border:1px solid var(--ln);border-radius:24px;gap:2px}.lg,.sp,.hd{display:none}.nv{flex-direction:column;gap:0;padding:5px 2px;font-size:10px;text-align:center;min-width:50px;width:auto;flex:1 0 auto}main{margin-right:0;padding-bottom:110px}.st,.flow{grid-template-columns:1fr 1fr}.pg{padding:20px;border-radius:26px}}
</style></head><body>
<aside><div class="lg"><img class="lw-l" src="logo-wide.png" alt="ابن رشدي"><img class="lw-d" src="logo-wide-dark.png" alt="" aria-hidden="true"></div><nav id="nav" style="display:contents"></nav><div class="sp"></div><a class="nv hd" href="dashboard.html"><i>↩</i>لوحة الطالب</a><button class="nv hd" id="th"><i>🌓</i>تبديل الوضع</button><button class="nv hd" id="out"><i>🚪</i>خروج</button></aside>
<main><div id="v"></div></main>
<script src="supabase.js"></script><script src="config.js"></script>
<script src="admin.js" defer></script></body></html>
