<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لوحة الإدارة | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--ok:#2E7D4F;--sage:#DCE5D3;--rose:#F1D9CF;--sky:#D6E2EC;--sh:0 1px 2px rgba(60,45,10,.05),0 14px 34px -14px rgba(60,45,10,.2)}
:root[data-theme=dark]{--bg:#0F1522;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--ok:#6CC38F;--sage:#1F2D2B;--rose:#2C2230;--sky:#1A2A3F;--sh:0 14px 34px -14px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;overflow-x:hidden}
h1,h2,h3,h4,b,.lg{font-family:'Readex Pro',sans-serif;line-height:1.35}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--sf);border-left:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:50;overflow:auto}
.lg img{width:100%;height:auto}.lw-d{display:none}:root[data-theme=dark] .lw-l{display:none}:root[data-theme=dark] .lw-d{display:block}.lg{padding:0 6px 14px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;color:var(--mut);font-weight:600;width:100%;text-decoration:none;transition:.2s}.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--pri);color:var(--onpri)}.nv i{font-style:normal;font-size:18px}.sp{flex:1}
main{margin-right:250px;padding:26px clamp(16px,3vw,44px) 60px;max-width:1180px}
.pg{position:relative;overflow:hidden;border-radius:32px;padding:26px 32px;margin-bottom:18px;color:#F6F0E2;background:linear-gradient(135deg,#1F3A5F,#3A6EA5);box-shadow:0 18px 40px rgba(18,36,61,.25)}
.pg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.4px,transparent 1.6px);background-size:24px 24px;opacity:.5;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.pg>*{position:relative}.pg small{display:inline-block;padding:3px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:13px;margin-bottom:8px}.pg h2{font:700 clamp(28px,4.5vw,42px)/1.2 'Reem Kufi',sans-serif}.pg p{opacity:.9;margin-top:4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.sc{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;margin:0;transition:.25s}.sc:hover{transform:translateY(-3px);border-color:var(--gold)}
.sc .bx{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:none}.t1{background:var(--sage)}.t2{background:var(--rose)}.t3{background:var(--sky)}.t4{background:#F3E2B8}:root[data-theme=dark] .t4{background:#3A3022}
.sc b{font-size:26px;display:block}.sc span{font-size:13.5px;color:var(--mut)}
.mt{color:var(--mut)}.bd{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut)}.bd.ok{background:var(--ok);color:#fff}.bd.no{background:#b3402a;color:#fff}.bd.g{background:var(--gold);color:#1B1405}
.btn{border-radius:99px;padding:8px 18px;border:1.5px solid var(--ln);background:none;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.gld{background:linear-gradient(135deg,#F0C46E,#C98A1F);color:#1B1405;border:0}.btn.no{border-color:#b3402a;color:#b3402a}.btn.sm{padding:4px 12px;font-size:14px}
input,textarea,select{width:100%;padding:11px 15px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);margin:5px 0 12px}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--gold)}
.fl{display:block;font-weight:600;font-size:14px}.rw{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.rw:last-child{border:0}.rw>.gr{flex:1;min-width:150px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{margin:0;flex:1;min-width:150px}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chp{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 16px;font-weight:600}.chp.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.g3 div{background:var(--bg2);border-radius:18px;padding:10px;text-align:center}.g3 b{font-size:24px;display:block;color:var(--pri)}.g3 span{font-size:13px;color:var(--mut)}
.mdl{position:fixed;inset:0;z-index:200;background:rgba(10,16,28,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px}.mb{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px 20px;margin:0}.mb h3{font:700 22px 'Reem Kufi',sans-serif;margin-bottom:6px}.mb h4{margin:16px 0 4px;color:var(--pri)}
.mx{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--sf)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;max-width:90vw;text-align:center}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.flow div{background:var(--bg2);border-radius:18px;padding:12px;font-size:14px}.flow b{color:var(--gold);display:block}
@media(max-width:860px){aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;flex-direction:row;padding:6px;border:1px solid var(--ln);border-radius:24px;gap:2px}.lg,.sp,.hd{display:none}.nv{flex-direction:column;gap:0;padding:5px 2px;font-size:10px;text-align:center;min-width:56px;flex:none}main{margin-right:0;padding-bottom:110px}.st,.flow{grid-template-columns:1fr 1fr}.pg{padding:20px;border-radius:26px}}
</style></head><body>
<aside><div class="lg"><img class="lw-l" src="logo-wide.png" alt="ابن رشدي"><img class="lw-d" src="logo-wide-dark.png" alt="" aria-hidden="true"></div><nav id="nav" style="display:contents"></nav><div class="sp"></div><a class="nv hd" href="dashboard.html"><i>↩</i>لوحة الطالب</a><button class="nv hd" id="th"><i>🌓</i>تبديل الوضع</button><button class="nv hd" id="out"><i>🚪</i>خروج</button></aside>
<main><div id="v"></div></main>
<script src="supabase.js"></script><script src="config.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.documentElement;try{const t=localStorage.getItem('th');if(t)root.dataset.theme=t}catch(e){}
const sb=supabase.createClient(SB_URL,SB_KEY),go=u=>location.replace(u);
const{data:{session}}=await sb.auth.getSession();if(!session)return go('login.html');
const{data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
if(!me||me.role!=='admin')return go('dashboard.html');
const GR=['الصف الرابع الابتدائي','الصف الخامس الابتدائي','الصف السادس الابتدائي','الصف الأول الإعدادي','الصف الثاني الإعدادي','الصف الثالث الإعدادي','الصف الأول الثانوي','الصف الثاني الثانوي','الصف الثالث الثانوي'];
const T=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)};
const E=(t,f)=>f(sb.from(t)).then(r=>{if(r.error)T('خطأ: '+r.error.message);return r.data||[]});
const L=(a,d)=>sb.from('admin_log').insert({admin:me.id,action:a,detail:d});
const RP=async(n,a)=>{const r=await sb.rpc(n,a);if(r.error){T('خطأ: '+r.error.message);return 0}T('تم ✅');return 1};
const dt=x=>new Date(x).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
const code=p=>p+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
function M(h){const m=document.createElement('div');m.className='mdl';m.innerHTML='<div class="mb card"><button class="mx" aria-label="إغلاق">✕</button>'+h+'</div>';document.body.appendChild(m);const c=()=>m.remove();m.onclick=e=>{if(e.target===m)c()};m.querySelector('.mx').onclick=c;return{m,c}}
const F=(f,v={})=>f.map(([k,l,t,o])=>`<label class="fl">${l}</label>`+(t==='sel'?`<select name="${k}">${o.map(x=>`<option value="${esc(x[0])}"${String(v[k]??'')===String(x[0])?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`:t==='ta'?`<textarea name="${k}">${esc(v[k]??'')}</textarea>`:`<input name="${k}" type="${t||'text'}" value="${esc(v[k]??'')}">`)).join('');
const V=(m,f)=>{const o={};f.forEach(([k,,t])=>{const x=m.querySelector('[name='+k+']').value;o[k]=t==='number'?(x===''?null:+x):x});return o};
/* نافذة تعديل/إضافة عامة: تحفظ في الجدول وتسجّل في السجل */
function ED(title,f,v,tb,done,pre){const nw=!(v&&v.id);const{m,c}=M(`<h3>${title}</h3>${F(f,v||{})}<div class="acts"><button class="btn gld" id="sv">حفظ</button>${nw?'':'<button class="btn no" id="dl">حذف</button>'}</div>`);
 m.querySelector('#sv').onclick=async()=>{let o=V(m,f);if(pre){o=pre(o);if(!o)return}const r=await(nw?sb.from(tb).insert(o):sb.from(tb).update(o).eq('id',v.id));if(r.error)return T('خطأ: '+r.error.message);L(nw?'إضافة':'تعديل',tb+': '+(o.title||o.full_name||''));T('تم ✅');c();done&&done()};
 if(!nw)m.querySelector('#dl').onclick=async()=>{if(!confirm('متأكد من الحذف؟ مش هينفع ترجّعه.'))return;const r=await sb.from(tb).delete().eq('id',v.id);if(r.error)return T('خطأ: '+r.error.message);L('حذف',tb+': '+(v.title||v.full_name||''));c();done&&done()}}
const NAMES={};(await E('profiles',q=>q.select('id,full_name'))).forEach(p=>NAMES[p.id]=p.full_name);

/* ===== نافذة الطالب ===== */
const SF=[['full_name','الاسم'],['phone','الموبايل','tel'],['parent_phone','موبايل ولي الأمر','tel'],['grade','المرحلة','sel',[['','—'],...GR.map(g=>[g,g])]],['role','النوع','sel',[['student','طالب'],['parent','ولي أمر'],['admin','أدمن']]],['banned','الحساب','sel',[['false','شغّال'],['true','محظور']]]];
async function SM(s){const[cs,ls,en,gr,w]=await Promise.all([E('courses',q=>q.select('id,title,code')),E('lessons',q=>q.select('id,code,title').order('code')),E('enrollments',q=>q.select('course_id').eq('student_id',s.id)),E('lesson_grants',q=>q.select('lesson_id').eq('student_id',s.id)),E('wallets',q=>q.select('balance').eq('student_id',s.id))]);
 const has=new Set(en.map(x=>String(x.course_id))),gs=new Set(gr.map(x=>x.lesson_id)),bal=Number(w[0]?.balance)||0;
 const{m,c}=M(`<h3>${esc(s.full_name)} <span class="bd">${esc(s.role)}</span></h3><p class="mt">انضم ${dt(s.created_at)}</p><div class="g3"><div><b>${s.points||0}</b><span>نقط</span></div><div><b>${bal}</b><span>رصيد (ج.م)</span></div><div><b>${has.size}</b><span>كورس</span></div></div>
 <div class="acts"><button class="btn sm" data-a="p+">+ نقط</button><button class="btn sm" data-a="p-">− نقط</button><button class="btn sm" data-a="w+">+ رصيد</button><button class="btn sm" data-a="w-">− رصيد</button></div>
 <h4>بياناته</h4>${F(SF,{...s,banned:String(!!s.banned)})}<button class="btn gld" id="sv">حفظ البيانات</button>
 <h4>الكراسي (فتح / قفل كورس)</h4>${cs.map(x=>{const h=has.has(String(x.id));return`<div class="rw"><span class="gr"><span class="bd g">${esc(x.code||'بدون كود')}</span> ${esc(x.title)}</span><button class="btn sm ${h?'no':''}" data-e="${x.id}" data-o="${h?0:1}">${h?'قفل':'فتح'}</button></div>`}).join('')||'<p class="mt">مفيش كورسات لسه.</p>'}
 <h4>حصص مفتوحة له لوحدها</h4><div class="acts">${ls.filter(l=>gs.has(l.id)).map(l=>`<button class="btn sm" data-g="${l.id}" title="اضغط للقفل">${esc(l.code)} ✕</button>`).join('')||'<span class="mt">مفيش.</span>'}</div>
 <select id="ls">${ls.filter(l=>!gs.has(l.id)).map(l=>`<option value="${l.id}">${esc(l.code)} · ${esc(l.title)}</option>`).join('')}</select><button class="btn" id="gl">فتح الحصة دي</button>`);
 const re=async()=>{c();SM((await sb.from('profiles').select('*').eq('id',s.id).single()).data)};
 m.querySelector('#sv').onclick=async()=>{const o=V(m,SF);o.banned=o.banned==='true';o.grade=o.grade||null;const r=await sb.from('profiles').update(o).eq('id',s.id);if(r.error)return T('خطأ: '+r.error.message);L('تعديل طالب',o.full_name);T('تم ✅');re()};
 m.addEventListener('click',async e=>{const b=e.target.closest('button'),d=b&&b.dataset;if(!d)return;let ok=0;
  if(d.a){const n=+prompt('كام؟');if(!(n>0))return;const g=d.a[1]==='+'?n:-n,p=d.a[0]==='p';ok=await RP(p?'admin_points':'admin_wallet',{p_student:s.id,p_delta:g});ok&&L(p?'نقط':'رصيد',s.full_name+' '+g)}
  else if(d.e){ok=await RP('admin_enroll',{p_student:s.id,p_course:d.e,p_open:d.o==='1'});ok&&L(d.o==='1'?'فتح كرسي':'قفل كرسي',s.full_name)}
  else if(d.g){ok=await RP('admin_grant',{p_student:s.id,p_lesson:d.g,p_open:false});ok&&L('قفل حصة',s.full_name)}
  else if(b.id==='gl'){const id=m.querySelector('#ls').value;if(!id)return;ok=await RP('admin_grant',{p_student:s.id,p_lesson:id,p_open:true});ok&&L('فتح حصة',s.full_name)}
  if(ok)re()})}

/* ===== الصفحات ===== */
const PG=(t,s,p)=>`<header class="pg"><small>${s}</small><h2>${t}</h2><p>${p}</p></header>`;
let CUR='ov';
const N=[['ov','🏠','نظرة عامة'],['st','👥','الطلاب'],['co','📚','الكورسات'],['tp','💰','الشحن'],['ex','📝','الامتحانات'],['sp','💬','الدعم'],['lg','📜','السجل']];
const VW={
async ov(){const n=async(t,f=q=>q)=>(await f(sb.from(t).select('id',{count:'exact',head:true}))).count||0;
 const[a,b,c,d,e,f,g]=await Promise.all([n('profiles',q=>q.eq('role','student')),n('profiles',q=>q.eq('role','parent')),n('courses'),n('lessons'),n('wallet_topups',q=>q.eq('status','pending')),n('support_tickets',q=>q.eq('status','open')),E('admin_log',q=>q.select('*').order('at',{ascending:false}).limit(10))]);
 const sc=(x,l,t,i,go)=>`<div class="card sc" data-go="${go}"><div class="bx ${t}">${i}</div><div><b>${x}</b><span>${l}</span></div></div>`;
 return PG('لوحة الإدارة','أهلاً '+esc(me.full_name.split(' ')[0]),'كل حاجة في المنصة بتتحكم فيها من هنا.')+`<div class="st">${sc(a,'طالب','t1','🎓','st')+sc(b,'ولي أمر','t2','👨‍👩‍👧','st')+sc(c,'كورس','t3','📚','co')+sc(d,'حصة','t4','🎬','co')}</div><div class="st">${sc(e,'طلب شحن منتظر','t4','💰','tp')+sc(f,'رسالة دعم مفتوحة','t2','💬','sp')}</div>
 <div class="card"><h3>إزاي النظام شغال؟</h3><div class="flow" style="margin-top:10px"><div><b>1 · الكورس</b>بتضيف كورس وليه كود (C-XXXX) وفيه حصص كل واحدة ليها كود (L-XXXX).</div><div><b>2 · الطالب</b>بيسجّل بنفسه، وإنت تعدّل بياناته وتديله نقط ورصيد.</div><div><b>3 · الكرسي</b>فتح الكرسي = اشتراكه في الكورس. القفل بيشيله. وتقدر تفتحله حصة واحدة بس.</div><div><b>4 · الفلوس</b>الطالب يبعت طلب شحن، إنت تشوف الإيصال وتقبل فيتضاف الرصيد.</div></div></div>
 <div class="card"><h3>آخر العمليات</h3>${f.map(x=>`<div class="rw"><span class="bd g">${esc(x.action)}</span><span class="gr">${esc(x.detail)}</span><small class="mt">${dt(x.at)}</small></div>`).join('')||'<p class="mt">لسه مفيش عمليات.</p>'}</div>`},
async st(){const ps=await E('profiles',q=>q.select('*').order('created_at',{ascending:false}));let q='',r='all',g='';
 const dr=()=>{const l=ps.filter(p=>(r==='all'||p.role===r)&&(!g||p.grade===g)&&((p.full_name||'')+(p.phone||'')).includes(q));$('#sl').innerHTML=l.map(p=>`<div class="rw" data-p="${p.id}" style="cursor:pointer"><b class="gr">${esc(p.full_name)}</b><span class="mt" dir="ltr">${esc(p.phone)}</span><span class="bd">${esc((p.grade||p.role).replace('الصف ',''))}</span><span class="bd g">${p.points||0} نقطة</span>${p.banned?'<span class="bd no">محظور</span>':''}</div>`).join('')||'<p class="mt">مفيش نتيجة.</p>';$$('[data-p]').forEach(x=>x.onclick=()=>SM(ps.find(p=>p.id===x.dataset.p)))};
 setTimeout(()=>{$('#q').oninput=e=>{q=e.target.value.trim();dr()};$('#fr').onchange=e=>{r=e.target.value;dr()};$('#fg').onchange=e=>{g=e.target.value;dr()};dr()});
 return PG('الطلاب','إدارة الحسابات',ps.length+' حساب. دوس على أي واحد تتحكم فيه.')+`<div class="tools"><input id="q" placeholder="ابحث بالاسم أو الموبايل"><select id="fr"><option value="all">الكل</option><option value="student">طلاب</option><option value="parent">أولياء أمور</option><option value="admin">أدمن</option></select><select id="fg"><option value="">كل المراحل</option>${GR.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="card" id="sl"></div>`},
async co(){const[cs,ls]=await Promise.all([E('courses',q=>q.select('*').order('created_at')),E('lessons',q=>q.select('*').order('pos'))]);
 const CF=[['code','كود الكورس'],['title','اسم الكورس'],['description','الوصف','ta'],['grade','المرحلة','sel',GR.map(x=>[x,x])],['price','السعر (ج.م)','number'],['lessons_count','عدد الحصص','number']];
 const cd=c=>ED(c?'تعديل كورس':'كورس جديد',CF,c||{code:code('C'),price:0,lessons_count:0},'courses',()=>show('co'));
 const lm=c=>{const mine=ls.filter(l=>String(l.course_id)===String(c.id));const{m,c:cl}=M(`<h3>حصص: ${esc(c.title)}</h3>${mine.map(l=>`<div class="rw"><span class="bd g">${esc(l.code)}</span><span class="gr">${esc(l.title)}</span><button class="btn sm" data-l="${l.id}">تعديل</button></div>`).join('')||'<p class="mt">مفيش حصص لسه.</p>'}<div class="acts"><button class="btn gld" id="nl">+ حصة جديدة</button></div>`);
  const LF=[['code','كود الحصة'],['title','اسم الحصة'],['video_url','رابط الفيديو'],['pos','الترتيب','number']],sync=async()=>{const n=(await E('lessons',q=>q.select('id').eq('course_id',String(c.id)))).length;await sb.from('courses').update({lessons_count:n}).eq('id',c.id);show('co')};
