<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>لوحتي | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--ok:#2E7D4F;--sh:0 10px 30px rgba(60,45,10,.10)}
:root[data-theme=dark]{--bg:#111725;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--ok:#6CC38F;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
h1,h2,h3,.lg{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.35}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
aside{position:fixed;top:0;bottom:0;right:0;width:260px;background:var(--sf);border-left:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:50;transition:transform .25s}
.lg{font-weight:700;font-size:20px;padding:6px 10px 18px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:none;text-align:right;color:var(--mut);font-weight:500;width:100%}
.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--pri);color:var(--onpri)}.sp{flex:1}
main{margin-right:260px;padding:28px clamp(16px,3vw,40px) 60px;max-width:1200px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.top h1{font-size:clamp(22px,3.5vw,32px);flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf)}#mb{display:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.hero{background:var(--pri);color:var(--onpri);border-radius:24px;padding:28px;margin-bottom:20px}.hero p{opacity:.85}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.st b{display:block;font:700 30px 'Readex Pro';color:var(--gold)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cv{height:110px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:48px;margin-bottom:12px}
.bd{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut)}.bd.ok{background:var(--ok);color:#fff}
.btn{border-radius:99px;padding:10px 20px;border:1.5px solid var(--ln);background:none;font-weight:600}.btn.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn:disabled{opacity:.55;cursor:not-allowed}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.fl .btn.on{background:var(--pri);color:var(--onpri)}
input,textarea{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);margin:6px 0 14px}textarea{min-height:120px;resize:vertical}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.mt{color:var(--mut)}.er{color:#b3402a;min-height:24px}.mp{color:var(--ok)}
@media(max-width:860px){aside{transform:translateX(100%)}aside.on{transform:none;box-shadow:var(--sh)}main{margin-right:0}#mb{display:block}}
</style></head><body>
<aside id="sd"><div class="lg">منصة ابن رشدي</div><nav id="nav"></nav><div class="sp"></div><button class="nv" id="th">🌓 الوضع</button><button class="nv" id="out">🚪 تسجيل الخروج</button></aside>
<main><div class="top"><button class="ib" id="mb" aria-label="القائمة">☰</button><h1 id="tt">...</h1></div><div id="v"><p class="mt">جاري التحميل...</p></div></main>
<script src="supabase.js"></script><script src="config.js"></script><script src="app.js" defer></script></body></html>
