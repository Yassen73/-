<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3A5F"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>لوحتي | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--ok:#2E7D4F;--sage:#DCE5D3;--rose:#F1D9CF;--sky:#D6E2EC;--sh:0 10px 30px rgba(60,45,10,.10)}
:root[data-theme=dark]{--bg:#0F1522;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--ok:#6CC38F;--sage:#1F2D2B;--rose:#2C2230;--sky:#1A2A3F;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;transition:background .3s;overflow-x:hidden}
h1,h2,h3,b,.lg{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.35}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--sf);border-left:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:50}
.lg{font-weight:700;font-size:20px;padding:4px 10px 22px;display:flex;align-items:center;gap:10px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:none;color:var(--mut);font-weight:500;width:100%;transition:.2s}
.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--pri);color:var(--onpri);box-shadow:0 8px 20px rgba(31,58,95,.3)}.sp{flex:1}
main{margin-right:250px;padding:26px clamp(16px,3vw,44px) 60px;max-width:1180px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.top h1{font:700 clamp(22px,3.5vw,30px) 'Reem Kufi','Readex Pro',sans-serif;flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:20px;box-shadow:var(--sh)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tw{50%{opacity:.25}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes flt{50%{transform:translateY(-14px) rotate(3deg)}}@keyframes sh{to{background-position:-200% 0}}
.lw-d{display:none}:root[data-theme=dark] .lw-l{display:none}:root[data-theme=dark] .lw-d{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mt{color:var(--mut)}.er{color:#b3402a;min-height:24px}
.bd{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut)}.bd.ok{background:var(--ok);color:#fff}
.pb{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width 1s}
.bw{margin-bottom:12px}.bwh{display:flex;justify-content:space-between;gap:10px}
.btn{border-radius:99px;padding:10px 20px;border:1.5px solid var(--ln);background:none;font-weight:600;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit}.btn:hover{transform:translateY(-2px)}.btn.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.gld{background:linear-gradient(135deg,#F0C46E,#C98A1F);color:#1B1405;border:0;box-shadow:0 8px 22px rgba(201,138,31,.4)}.btn.gh{border-color:rgba(255,255,255,.4);color:#F6F0E2}
input,textarea{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);margin:6px 0 14px}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row .ic{width:18px;height:18px;vertical-align:-4px}

/* خلفية الصفحة */
.pbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pbg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(201,138,31,.30) 1.5px,transparent 1.7px);background-size:26px 26px;opacity:.5;-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%)}
.pbg .sun{position:absolute;top:-140px;left:-100px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,31,.22),transparent 68%)}
.pbg .neb,.pbg b{display:none}
:root[data-theme=dark] .pbg .sun{display:none}
:root[data-theme=dark] .pbg .neb{display:block;position:absolute;top:-160px;right:-110px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(70,100,170,.24),transparent 68%)}
:root[data-theme=dark] .pbg b{display:block;position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(227,178,90,.5);animation:tw 4.5s ease-in-out infinite}
.mc{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 14px 4px 4px;font-weight:600}
.mc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px 'Readex Pro';font-style:normal;background:linear-gradient(135deg,var(--pri),var(--gold));color:var(--onpri)}
.sh{display:flex;align-items:center;gap:10px;font:700 22px 'Reem Kufi','Readex Pro',sans-serif;margin:28px 0 8px}.sh:before{content:"";width:5px;height:24px;border-radius:4px;background:var(--gold)}
.shl{margin-inline-start:auto;font:500 13px 'IBM Plex Sans Arabic',sans-serif;color:var(--mut)}
#v>*{animation:up .5s both}#v>*:nth-child(2){animation-delay:.06s}#v>*:nth-child(3){animation-delay:.12s}#v>*:nth-child(4){animation-delay:.18s}#v>*:nth-child(n+5){animation-delay:.24s}

/* ===== لودر البوصلة (نفس رسمة الصفحة الرئيسية) ===== */
.ldr{display:grid;justify-items:center;gap:18px;padding:56px 0;text-align:center}
.cmp{width:min(230px,60vw);aspect-ratio:1;filter:drop-shadow(0 18px 32px rgba(201,138,31,.28))}.cmp svg{width:100%;height:100%;display:block}
.cmp .r1{transform-origin:200px 200px;animation:sp 6s linear infinite}.cmp .r2{transform-origin:200px 200px;animation:sp 3.2s linear infinite reverse}
.ldr b{font:700 20px 'Reem Kufi','Readex Pro',sans-serif}.dots{display:inline-flex;gap:5px;margin-inline-start:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bn 1.1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}

/* ===== هيرو الرئيسية (بدون صورة) ===== */
.hero2{position:relative;overflow:hidden;border-radius:36px;margin-bottom:18px;color:#F6F0E2;background:radial-gradient(120% 140% at 100% 0,#2F6199 0,#1F3A5F 48%,#12243D 100%);box-shadow:0 20px 44px rgba(18,36,61,.3)}
.hero2:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(227,178,90,.35) 1.5px,transparent 1.7px);background-size:26px 26px;opacity:.5;-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%)}
.hfx span{position:absolute;font:700 220px/1 'Aref Ruqaa',serif;color:#fff;opacity:.05;animation:flt 14s ease-in-out infinite}
.hfx span:nth-child(1){top:-14px;right:2%}.hfx span:nth-child(2){bottom:-50px;right:36%;font-size:170px;animation-delay:-4s}.hfx span:nth-child(3){top:34%;left:30%;font-size:150px;animation-delay:-7s}.hfx span:nth-child(4){top:-30px;left:44%;font-size:130px;animation-delay:-10s}
.hstar{position:absolute;left:-120px;top:50%;width:460px;height:460px;margin-top:-230px;opacity:.5;animation:sp 90s linear infinite;pointer-events:none}
.hg2{position:relative;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;padding:44px 46px}
.htx{max-width:560px}
.tag2{display:inline-flex;align-items:center;gap:8px;padding:4px 16px;border-radius:99px;font-size:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);margin-bottom:14px}
.hero2 .tag2:before{content:"";width:8px;height:8px;border-radius:50%;background:#6CC38F;animation:tw 1.6s infinite}
.htx h1{font:700 clamp(34px,5.4vw,60px)/1.22 'Reem Kufi','Readex Pro',sans-serif;margin-bottom:12px}
.htx h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(227,178,90,.5) 0)}
.lead2{opacity:.88;font-size:18px;max-width:440px;margin-bottom:22px}.cta2{display:flex;gap:10px;flex-wrap:wrap}
.hch{display:flex;gap:12px;flex-wrap:wrap}
.gc{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:12px 20px;min-width:140px;font-size:13.5px;line-height:1.5}.gc b{display:block;font:700 26px 'Readex Pro'}

/* إحصائيات */
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px}
.sc{display:flex;gap:14px;align-items:center;padding:16px;border-radius:24px;transition:.25s}.sc:hover{transform:translateY(-3px);border-color:var(--gold)}
.sc .bx{position:relative;width:50px;height:50px;border-radius:17px;display:grid;place-items:center;color:var(--pri)}.sc .bx:after{content:"";position:absolute;inset:-5px;border-radius:22px;border:1px dashed var(--ln)}
.t1{background:var(--sage)}.t2{background:var(--rose)}.t3{background:var(--sky)}.t4{background:#F3E2B8}:root[data-theme=dark] .t4{background:#3A3022}
.sc b{font:700 28px/1.15 'Readex Pro';display:block}.sc span{font-size:13.5px;line-height:1.3;display:block;color:var(--mut)}
.pnd{margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin:18px 0 6px}.ring{position:relative;display:grid;place-items:center}.ring b{position:absolute;font-size:26px}
.kid{margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* ===== شريط الأبواب الأفقي ===== */
.rw{position:relative;margin:0 -6px}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 8px 26px;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.rail::-webkit-scrollbar{display:none}.rail.dg{cursor:grabbing;scroll-snap-type:none;user-select:none}.rail>*{flex:none;scroll-snap-align:start}
.ra{position:absolute;top:40%;z-index:5;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center;transition:.2s}
.ra.l{left:-8px}.ra.r{right:-8px}.ra.r svg{transform:scaleX(-1)}.ra:hover:not(:disabled){background:var(--gold);color:#1B1405;transform:scale(1.08)}.ra:disabled{opacity:.35;cursor:default}
.rw.ns .ra,.rw.ns .rp{display:none}
.rp{height:4px;border-radius:4px;background:var(--bg2);margin:-8px 10px 0;overflow:hidden}.rp i{display:block;height:100%;width:30%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .3s}
@media(hover:none){.ra{display:none}}

/* ===== كارت الكورس = باب ===== */
.dc{width:300px;padding:12px 12px 18px;background:var(--sf);border:1px solid var(--ln);border-radius:150px 150px 30px 30px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s}
.dc:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(18,36,61,.2)}
.dca{position:relative;height:272px;border-radius:138px 138px 22px 22px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 0 0 3px var(--gold);isolation:isolate;perspective:700px}
.dc-c{position:absolute;left:50%;bottom:-12%;width:82%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--c);box-shadow:0 0 0 10px rgba(255,255,255,.12),0 0 50px rgba(0,0,0,.25)}
.dc-l{position:absolute;top:14%;right:9%;font:700 150px/1 'Aref Ruqaa',serif;color:#fff;opacity:.13;animation:flt 11s ease-in-out infinite}
.dc-t{position:absolute;bottom:0;left:50%;height:90%;width:auto;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .5s;pointer-events:none}
.dc:hover .dc-t{transform:translateX(-50%) scale(1.05)}
.gb{position:absolute;bottom:10px;right:10px;z-index:4;background:rgba(250,246,236,.94);color:#1B2433;border-radius:99px;padding:2px 12px;font:600 12.5px 'Readex Pro'}.gb.ok{right:auto;left:10px;background:var(--ok);color:#fff}
/* ضلفتين الباب بتتفتح */
.dca:before,.dca:after{content:"";position:absolute;top:0;bottom:0;width:50.5%;z-index:6;backface-visibility:hidden;animation-duration:1.15s;animation-timing-function:cubic-bezier(.65,0,.25,1);animation-fill-mode:forwards;animation-delay:calc(var(--k,0)*110ms + .3s)}
.dca:before{right:0;transform-origin:right center;animation-name:dr;background:radial-gradient(circle at 15px 52%,#F0C46E 0 6px,transparent 7px),linear-gradient(90deg,#0b5d58,#16897f);box-shadow:inset 0 0 0 7px rgba(227,178,90,.6),inset 0 0 40px rgba(0,0,0,.35)}
.dca:after{left:0;transform-origin:left center;animation-name:dl;background:radial-gradient(circle at calc(100% - 15px) 52%,#F0C46E 0 6px,transparent 7px),linear-gradient(270deg,#0b5d58,#16897f);box-shadow:inset 0 0 0 7px rgba(227,178,90,.6),inset 0 0 40px rgba(0,0,0,.35)}
@keyframes dr{to{transform:rotateY(-118deg)}}@keyframes dl{to{transform:rotateY(118deg)}}
.dcb{padding:16px 8px 0;display:flex;flex-direction:column;gap:8px}
.dcb h3{font:700 21px/1.4 'Reem Kufi','Readex Pro',sans-serif}.dcb .mt{font-size:14.5px}.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.mt2{display:flex;gap:16px;color:var(--mut);font-size:13.5px}.mt2 span{display:inline-flex;align-items:center;gap:5px}.mt2 .ic{width:16px;height:16px}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.pr b{font-size:24px;color:var(--pri)}.pr small{font-size:13px;color:var(--mut);font-weight:500}
.cnt{display:flex;color:var(--mut);font-size:14px;margin:4px 4px 0}

/* ===== بانر الأبواب (الصورة كاملة) ===== */
.doors{position:relative;overflow:hidden;border-radius:32px;margin:18px 0 6px;color:#fff;background:#0d3a40;box-shadow:0 18px 40px rgba(14,60,56,.28)}
.dimg{position:relative}.dimg img{display:block;width:100%;height:auto}
.kg{position:absolute;left:58%;top:30%;width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.55),transparent 65%);animation:pls 2.6s ease-in-out infinite;pointer-events:none}
@keyframes pls{50%{transform:scale(1.5);opacity:.35}}
.dt{position:absolute;left:0;top:0;bottom:0;width:50%;padding:30px 36px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;background:linear-gradient(to right,rgba(6,28,34,.92),rgba(6,28,34,.7) 60%,transparent)}
.dt h3{font:700 clamp(24px,3.4vw,38px)/1.3 'Reem Kufi','Readex Pro',sans-serif}.dt p{opacity:.92}

/* ===== رحلتك ===== */
.jr{margin-top:22px}.jr .sh{margin-top:0}
.road{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.road:before{content:"";position:absolute;top:17px;right:12%;left:12%;border-top:2px dashed var(--ln)}
.stn{position:relative;text-align:center;opacity:.72}.stn.ok,.stn.now{opacity:1}
.stn b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 8px;border-radius:50%;background:var(--sf);border:2px solid var(--ln);font:700 16px 'Readex Pro'}
.stn.ok b{background:var(--gold);border-color:var(--gold);color:#1B1405}.stn.now b{background:var(--pri);border-color:var(--pri);color:var(--onpri);box-shadow:0 0 0 6px rgba(201,138,31,.2)}
.stn h4{font:600 17px 'Readex Pro'}.stn p{color:var(--mut);font-size:14px;line-height:1.55}

/* حكمة اليوم + ولي الأمر */
.orn{display:flex;align-items:center;justify-content:center;gap:10px}.orn i{height:2px;width:46px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold))}.orn i:last-child{transform:scaleX(-1)}.orn svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:5;stroke-linejoin:round}
.g2b{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin:26px 0 10px}
.qt{position:relative;overflow:hidden;background:var(--sage);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:30px 24px}.qt p{font:700 clamp(22px,3vw,29px)/1.7 'Aref Ruqaa',serif;position:relative}.qt small{color:var(--mut)}
.qm{position:absolute;top:-30px;right:14px;font:700 190px/1 'Aref Ruqaa',serif;color:var(--gold);opacity:.22}
.pl h3{font:700 21px 'Reem Kufi','Readex Pro',sans-serif;margin-bottom:4px}.pic{width:56px;height:56px;border-radius:18px;background:var(--rose);display:grid;place-items:center;font-size:28px;margin-bottom:10px}
.phn{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border:1px dashed var(--gold);border-radius:16px;padding:8px 14px;margin:12px 0}.phn b{font-size:18px}

/* ===== هيدر الصفحات ===== */
.pg{position:relative;overflow:hidden;border-radius:32px;padding:30px 34px;margin-bottom:18px;color:#F6F0E2;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 18px 40px rgba(18,36,61,.25)}
.pg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.4px,transparent 1.6px);background-size:24px 24px;opacity:.5;-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.pg>*{position:relative}.pg small{display:inline-block;padding:3px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:13px;margin-bottom:10px}
.pg h2{font:700 clamp(32px,5vw,48px)/1.2 'Reem Kufi','Readex Pro',sans-serif}.pg p{opacity:.92;max-width:460px;margin-top:6px}
.pg .pg-gl{position:absolute;left:26px;top:50%;translate:0 -50%;font:700 clamp(150px,22vw,240px)/1 'Aref Ruqaa',serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.4);animation:flt 9s ease-in-out infinite;pointer-events:none}
.pg-all{--g1:#1F3A5F;--g2:#3A6EA5}.pg-mine{--g1:#0E5A45;--g2:#2E9A6B}.pg-sup{--g1:#3B2F7E;--g2:#8A5FD0}
.sbx{display:flex;align-items:center;gap:10px;background:var(--sf);border:1.5px solid var(--ln);border-radius:99px;padding:0 18px;margin-bottom:12px;box-shadow:var(--sh)}.sbx:focus-within{border-color:var(--gold)}.sbx input{border:0;background:none;margin:0;padding:14px 0;outline:0!important}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.chp{flex:none;border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 18px;font-weight:600;transition:.2s}.chp:hover{border-color:var(--gold)}.chp.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);box-shadow:var(--sh)}
