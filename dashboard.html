<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3A5F"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>لوحتي | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--ok:#2E7D4F;--sh:0 12px 34px rgba(60,45,10,.10)}
:root[data-theme=dark]{--bg:#0F1522;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--ok:#6CC38F;--sh:0 12px 34px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;transition:background .3s}
h1,h2,h3,b,.lg{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.35}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--sf);border-left:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:50}
.lg{font-weight:700;font-size:20px;padding:4px 10px 22px;display:flex;align-items:center;gap:10px}.lg i{width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-style:normal}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:none;color:var(--mut);font-weight:500;width:100%;transition:.2s}
.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--pri);color:var(--onpri);box-shadow:var(--sh)}.sp{flex:1}
main{margin-right:250px;padding:26px clamp(16px,3vw,44px) 60px;max-width:1180px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.top h1{font-size:clamp(22px,3.5vw,30px);flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:20px;box-shadow:var(--sh);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px;margin-bottom:20px;color:#F6F0E2;background:linear-gradient(135deg,#1F3A5F,#2B5A8C 60%,#C98A1F);animation:up .5s both}
.hero h2{font-size:clamp(24px,4vw,34px)}.hero p{opacity:.9;max-width:520px}.hero small{opacity:.75}
.hero svg{position:absolute;left:-60px;top:-60px;width:280px;opacity:.18;animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.sc{display:flex;gap:12px;align-items:center}.sc .bx{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}.sc b{font-size:26px;display:block}.sc span{color:var(--mut);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:20px}.ring{position:relative;display:grid;place-items:center}.ring b{position:absolute;font-size:26px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.cv{height:120px;border-radius:16px;display:grid;place-items:center;font-size:52px;margin-bottom:14px;position:relative;overflow:hidden}
.cv:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);left:-40px;bottom:-60px}
.bd{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut)}.bd.ok{background:var(--ok);color:#fff}
.pb{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width 1s}
.btn{border-radius:99px;padding:10px 20px;border:1.5px solid var(--ln);background:none;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.fl .btn.on{background:var(--pri);color:var(--onpri)}
input,textarea{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);margin:6px 0 14px}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
details{border-bottom:1px solid var(--ln);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mut);margin-top:6px}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--gold));color:var(--onpri);display:grid;place-items:center;font:700 32px 'Readex Pro';margin:0 auto 10px}
.mt{color:var(--mut)}.er{color:#b3402a;min-height:24px}.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--sf),var(--bg2),var(--sf));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:14px}@keyframes sh{to{background-position:-200% 0}}
@media(max-width:860px){aside{top:auto;left:0;right:0;width:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-left:0;border-top:1px solid var(--ln)}.lg,.sp,#out{display:none}
.nv{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;justify-content:center;text-align:center}main{margin-right:0;padding-bottom:100px}.g2{grid-template-columns:1fr}}
.lw-d{display:none}:root[data-theme=dark] .lw-l{display:none}:root[data-theme=dark] .lw-d{display:block}</style></head><body>
<aside id="sd"><div class="lg" style="padding-bottom:18px"><img class="lw-l" src="logo-wide.png" alt="منصة ابن رشدي" style="width:100%;height:auto"><img class="lw-d" src="logo-wide-dark.png" alt="" aria-hidden="true" style="width:100%;height:auto"></div><nav id="nav" style="display:contents"></nav><div class="sp"></div><button class="nv" id="out"></button></aside>
<main><div class="top"><h1 id="tt">...</h1><button class="ib" id="th" aria-label="تبديل الوضع"></button></div><div id="v"><div class="sk"></div><div class="sk"></div></div></main>
<script src="supabase.js"></script><script src="config.js"></script><script src="app.js" defer></script></body></html>
