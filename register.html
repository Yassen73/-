<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light"><head>
<meta name="referrer" content="strict-origin-when-cross-origin"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3A5F"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب | منصة ابن رشدي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECDF;--bg2:#EAE2D0;--sf:#FAF6EC;--ink:#1B2433;--mut:#5E6677;--ln:#D9CFB8;--pri:#1F3A5F;--onpri:#F6F0E2;--gold:#C98A1F;--sage:#DCE5D3;--sh:0 20px 50px rgba(60,45,10,.14)}
:root[data-theme=dark]{--bg:#111725;--bg2:#161E30;--sf:#1B2438;--ink:#EEE7D6;--mut:#A3AABB;--ln:#2C3752;--pri:#E3B25A;--onpri:#17202F;--gold:#E3B25A;--sage:#1F2D2B;--sh:0 20px 50px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 85% 10%,var(--sage),transparent 45%),var(--bg);color:var(--ink);font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{position:relative;width:100%;max-width:460px;background:var(--sf);border:1px solid var(--ln);border-radius:32px;padding:34px 28px 28px;box-shadow:var(--sh);animation:pop .3s}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.x{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);display:grid;place-items:center;font-size:24px;line-height:1;cursor:pointer;text-decoration:none;color:var(--ink)}
.x:hover{background:var(--bg2)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-bottom:18px}
.logo i{width:42px;height:42px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:700 26px/1 'Aref Ruqaa',serif;font-style:normal;padding-bottom:6px}
.lg{font:700 27px/1.05 'Aref Ruqaa',serif;display:flex;flex-direction:column}
.lg small{font:500 11px 'Reem Kufi',sans-serif;color:var(--gold);letter-spacing:.35em}
h1{font:700 28px/1.4 'Reem Kufi','Readex Pro',sans-serif}
p.s{color:var(--mut);margin-bottom:18px}
.tabs{display:flex;background:var(--bg2);border-radius:99px;padding:4px;margin-bottom:18px}
.tabs a{flex:1;text-align:center;border-radius:99px;padding:7px 4px;font-weight:600;font-size:14px;text-decoration:none;color:var(--mut)}
.tabs a.on{background:var(--pri);color:var(--onpri)}
label{display:block;font-size:14px;margin:12px 0 4px;font-weight:500}
input,select{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg)}
input.bad{border-color:#C0473A}
.err{color:#C0473A;font-size:13px;min-height:20px;margin-top:6px}
.go{width:100%;margin-top:10px;border:0;border-radius:99px;padding:13px;font-weight:600;background:var(--pri);color:var(--onpri);cursor:pointer}
.ft{text-align:center;margin-top:16px;color:var(--mut);font-size:14px}.ft a{color:var(--ink);font-weight:600}
.ok{display:none;text-align:center;padding:20px 0}.ok b{display:block;font:700 22px 'Reem Kufi';margin:8px 0}
</style><style>.lw-d{display:none}:root[data-theme=dark] .lw-l{display:none}:root[data-theme=dark] .lw-d{display:block}.logo img.lw-l,.logo img.lw-d{height:var(--lh,56px);width:auto}.logo img.ft{height:120px;width:auto;display:block}.pg{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.pgb{flex:1;height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}.pgb i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s}.pg b{font-size:14px;min-width:42px;text-align:left}.stp{display:flex;gap:4px;list-style:none;padding:0;margin:0 0 6px}.stp li{flex:1;text-align:center;font-size:12px;color:var(--mut);border-bottom:3px solid var(--ln);padding-bottom:4px}.stp li.on{color:var(--ink);border-color:var(--pri);font-weight:600}.stp li.dn{border-color:var(--gold)}fieldset{border:0;padding:0;min-width:0}fieldset[hidden],[hidden]{display:none!important}.nav{display:flex;gap:10px;margin-top:10px}.nav .go{margin:0;width:auto;flex:1}.go.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ln);flex:0 0 36%}.go:disabled{opacity:.6;cursor:wait}.chk{display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:14px}.chk input{width:auto}.hint{color:var(--mut);font-size:12.5px;margin-top:4px}.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}.pw{position:relative}.pw input{padding-left:64px}.pw .eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px 8px;font-size:13px;color:var(--mut);cursor:pointer;border-radius:8px}</style></head><body>
<main class="card">
<a class="x" id="x" href="index.html" aria-label="إغلاق">×</a>
<a class="logo" href="index.html" aria-label="منصة ابن رشدي"><img class="lw-l" src="logo-wide.png" alt="منصة ابن رشدي"><img class="lw-d" src="logo-wide-dark.png" alt="" aria-hidden="true"></a>
<nav class="tabs"><a href="register.html" class="on">حساب جديد</a><a href="login.html">دخول</a><a href="parent.html">ولي أمر</a></nav>
<div id="fm"><h1>إنشاء حساب</h1><p class="s">كمّل بياناتك على 4 خطوات بسيطة.</p>
<div class="pg"><div class="pgb" id="pgb" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pgf" style="width:0%"></i></div><b id="pgt">0%</b></div><ol class="stp" id="stp"><li>بياناتك</li><li>الصف</li><li>التواصل</li><li>حسابك</li></ol>
<form id="f" data-mode="register" novalidate>
<fieldset data-s="0"><label for="n">اسم الطالب</label><input id="n" type="text" maxlength="60" autocomplete="name" placeholder="" ><label for="fn">اسم الوالد</label><input id="fn" type="text" maxlength="40" autocomplete="off" placeholder="" ><label for="gn">اسم الجد</label><input id="gn" type="text" maxlength="40" autocomplete="off" placeholder="" ><label for="gv">المحافظة</label><select id="gv"></select></fieldset>
<fieldset data-s="1" hidden><label for="st">المرحلة الدراسية</label><select id="st"></select><div id="sgw" hidden><label for="sg">الصف</label><select id="sg"></select></div><div id="trw" hidden><label for="tr">المسار</label><select id="tr"></select></div></fieldset>
<fieldset data-s="2" hidden><label for="em">الإيميل</label><input id="em" type="email" dir="ltr" maxlength="120" autocomplete="email" inputmode="email" placeholder="name@example.com" ><label for="p">رقم موبايل الطالب (مكالمات)</label><input id="p" type="tel" dir="ltr" maxlength="11" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" ><label class="chk"><input type="checkbox" id="wc" checked>رقم المكالمات عليه واتساب</label><div id="waw" hidden><label for="wa">رقم واتساب الطالب</label><input id="wa" type="tel" dir="ltr" maxlength="11" inputmode="tel" placeholder="01xxxxxxxxx" ></div><label for="mp">رقم الأم</label><input id="mp" type="tel" dir="ltr" maxlength="11" inputmode="tel" placeholder="01xxxxxxxxx" ><label for="fp">رقم الأب</label><input id="fp" type="tel" dir="ltr" maxlength="11" inputmode="tel" placeholder="01xxxxxxxxx" ><div class="hint">لازم تكتب رقم واحد على الأقل من الأم أو الأب.</div></fieldset>
<fieldset data-s="3" hidden><label for="w">كلمة المرور</label><input id="w" type="password" maxlength="72" autocomplete="new-password" placeholder="" ><label for="w2">تأكيد كلمة المرور</label><input id="w2" type="password" maxlength="72" autocomplete="new-password" placeholder="" ><div class="hint">8 حروف على الأقل وفيها حروف وأرقام.</div><div id="cf" style="margin:10px 0"></div><input class="hp" id="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"></fieldset>
<div class="err" id="er" role="alert"></div><div class="nav"><button class="go ghost" type="button" id="bk" hidden>السابق</button><button class="go" type="submit" id="nx">التالي</button></div></form>
<div class="ft">عندك حساب؟ <a href="login.html">سجّل دخولك</a></div></div>
<div class="ok" id="ok"><div style="font-size:44px">✓</div><b>تم إنشاء حسابك</b><p class="s">جاري تحويلك للمنصة...</p></div>
</main>
<script src="pw.js?v=2" defer></script><script src="supabase.js"></script><script src="config.js"></script><script src="auth.js" defer></script><script src="register.js" defer></script></body></html>
